name: App impresora (APK)

# Compila la app Android que atiende la cola de impresión (reemplazo de
# RawBT). En cada push a main que la toque, publica el APK instalable en
# el release "app-impresora" del repo; en ramas, lo deja como artefacto.

on:
  push:
    paths:
      - 'android-impresora/**'
      - '.github/workflows/app-impresora.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK (firmado con la llave debug, instalable)
        working-directory: android-impresora
        run: gradle assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp android-impresora/app/build/outputs/apk/release/app-release.apk pos-impresora.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pos-impresora
          path: pos-impresora.apk

      - name: Publicar release instalable (solo main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-impresora --yes || true
          git push origin :refs/tags/app-impresora || true
          gh release create app-impresora pos-impresora.apk \
            --title "App de impresión para la tablet" \
            --notes "Descarga pos-impresora.apk en la tablet, instálalo (permitir orígenes desconocidos), abre la app, pon la dirección del POS y el PIN, y toca INICIAR. Guía completa: docs/impresora-tablet.md" \
            --latest=false
